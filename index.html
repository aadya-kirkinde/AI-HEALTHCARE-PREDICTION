<body>

  <script src="auth.js"></script>

  <script type="text/babel" data-presets="react" src="SignupView.jsx?v=52"></script>
  <script type="text/babel" data-presets="react" src="SettingsDrawer.jsx?v=52"></script>

  <script type="text/babel" data-presets="react" src="App.jsx?v=52"></script>
  <script>
window.__babelErrors = [];
var _origErr = console.error;
console.error = function() {
  var args = Array.prototype.slice.call(arguments).join(' ');
  window.__babelErrors.push(args);
  try {
    var div = document.createElement('div');
    div.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#300;color:#f66;font-family:monospace;font-size:11px;padding:8px;z-index:99999;white-space:pre-wrap;max-height:200px;overflow:auto';
    div.textContent = args.slice(0, 500);
    document.body.appendChild(div);
  } catch(e) {}
  _origErr.apply(console, arguments);
};
window.onerror = function(msg, src, line, col, err) {
  if (src && src.indexOf('babel') !== -1 || (msg && msg.toLowerCase().indexOf('babel') !== -1)) return;
  try {
    var div = document.createElement('div');
    div.style.cssText = 'position:fixed;bottom:30px;left:0;right:0;background:#300;color:#f66;font-family:monospace;font-size:11px;padding:8px;z-index:99999;white-space:pre-wrap;max-height:200px;overflow:auto';
    div.textContent = msg + ' (' + src + ':' + line + ')';
    document.body.appendChild(div);
  } catch(e) {}
};
window.addEventListener('load', function() {
  setTimeout(function() {
    var root = document.getElementById('root');
    if (root && root.children.length === 0 && root.childNodes.length === 0) {
      var errDiv = document.createElement('div');
      errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#200;color:#f66;font-family:monospace;font-size:12px;padding:16px;z-index:99999';
      errDiv.textContent = 'React rendered nothing. Errors: ' + (window.__babelErrors.length ? window.__babelErrors.slice(0,3).join(' | ') : 'none');
      document.body.appendChild(errDiv);
    }
  }, 15000);
});
  </script>
</body>
</html>
